<section class="page">
  <h2>Enrollment Request</h2>
  <p>This is the template-driven starter form for the portal.</p>

  <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">
    <label>
      Name
      <input #nameCtrl="ngModel" name="studentName" [(ngModel)]="model.studentName" required minlength="3" />
      <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">Name is required</span>
      <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">Name must be at least 3 characters</span>
    </label>

    <label>
      Email
      <input #emailCtrl="ngModel" name="studentEmail" [(ngModel)]="model.studentEmail" type="email" required email />
      <span *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">Email is required</span>
      <span *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']">Enter a valid email</span>
    </label>

    <label>
      Course ID
      <input #courseCtrl="ngModel" name="courseId" [(ngModel)]="model.courseId" type="number" required />
      <span *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']">Course ID is required</span>
    </label>

    <label>
      Preferred Semester
      <select name="preferredSemester" [(ngModel)]="model.preferredSemester">
        <option>Odd</option>
        <option>Even</option>
      </select>
    </label>

    <label>
      <input name="agreeToTerms" [(ngModel)]="model.agreeToTerms" type="checkbox" required />
      Agree to terms
    </label>

    <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
    <button type="button" (click)="resetForm(enrollForm)">Reset</button>
  </form>

  <div *ngIf="submitted">Enrollment request submitted successfully!</div>
</section>

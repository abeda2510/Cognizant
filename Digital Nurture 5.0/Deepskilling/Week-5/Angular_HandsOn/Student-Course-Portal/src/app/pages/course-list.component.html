<section class="page">
  <h2>Course Listing</h2>
  <p class="muted">Browse available courses and request enrollment.</p>

  <label class="search-box">
    Search courses
    <input #searchInput type="text" placeholder="Search by title" [value]="searchTerm" (input)="onSearchChange(searchInput.value)" />
  </label>

  <p *ngIf="loading$ | async">Loading courses...</p>

  <p *ngIf="error$ | async as error" class="error">{{ error }}</p>

  <ng-container *ngIf="courses$ | async as courses">
    <div class="grid" *ngIf="courses.length; else noCourses">
    <app-course-card
      *ngFor="let course of courses; trackBy: trackByCourseId"
      [course]="course"
      appHighlight="lightblue"
      (courseSelected)="onCourseSelected($event)"
      (enrollRequested)="onEnroll($event)"
    ></app-course-card>
    </div>
  </ng-container>

  <ng-template #noCourses>
    <p>No courses available.</p>
  </ng-template>

  <p *ngIf="selectedCourseId" class="selected">Selected course ID: {{ selectedCourseId }}</p>
</section>
